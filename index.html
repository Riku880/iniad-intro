<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#102a43">
    <title>INIADの紹介</title>
    <style>
      :root {
        color-scheme: light;
        --navy: #102a43;
        --blue: #176b87;
        --teal: #18a6a6;
        --ink: #243b53;
        --muted: #627d98;
        --surface: #ffffff;
        --background: #f2f7fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        padding: 48px 20px;
        background: linear-gradient(160deg, #e6f4f5 0, var(--background) 360px);
        color: var(--ink);
        font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        font-size: 16px;
        line-height: 1.9;
      }

      main {
        width: min(100%, 860px);
        margin: 0 auto;
        padding: clamp(28px, 6vw, 64px);
        overflow: hidden;
        background: var(--surface);
        border: 1px solid #d9e7ed;
        border-radius: 24px;
        box-shadow: 0 20px 55px rgb(16 42 67 / 10%);
      }

      header {
        position: relative;
        margin: calc(clamp(28px, 6vw, 64px) * -1);
        margin-bottom: 42px;
        padding: clamp(42px, 8vw, 76px) clamp(28px, 6vw, 64px);
        overflow: hidden;
        background: linear-gradient(120deg, var(--navy), var(--blue));
        color: #fff;
      }

      header::after {
        position: absolute;
        right: -55px;
        bottom: -125px;
        width: 280px;
        height: 280px;
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 50%;
        box-shadow: 0 0 0 30px rgb(255 255 255 / 5%), 0 0 0 60px rgb(255 255 255 / 4%);
        content: "";
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #a9eeee;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.14em;
      }

      h1 {
        position: relative;
        z-index: 1;
        margin: 0;
        font-size: clamp(2rem, 6vw, 3.25rem);
        line-height: 1.3;
        letter-spacing: 0.04em;
      }

      section + section {
        margin-top: 42px;
      }

      h2 {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 18px;
        color: var(--navy);
        font-size: clamp(1.25rem, 3vw, 1.6rem);
      }

      h2::before {
        width: 5px;
        height: 1.25em;
        border-radius: 99px;
        background: linear-gradient(var(--teal), var(--blue));
        content: "";
      }

      p {
        margin: 0;
      }

      .overview {
        color: #486581;
        font-size: 1.03rem;
      }

      ul {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      li {
        position: relative;
        padding: 14px 16px 14px 42px;
        border: 1px solid #dce9ef;
        border-radius: 12px;
        background: #f8fbfc;
        color: var(--ink);
        font-weight: 600;
        transition: border-color 160ms ease, background-color 160ms ease, transform 160ms ease;
      }

      li::before {
        position: absolute;
        top: 50%;
        left: 17px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: var(--teal);
        content: "";
        transform: translateY(-50%);
      }

      li:hover {
        transform: translateY(-2px);
        border-color: #8bd6d3;
        background: #f0fbfa;
      }

      @media (max-width: 520px) {
        body {
          padding: 20px 12px;
        }

        main {
          border-radius: 18px;
        }

        header {
          margin-bottom: 32px;
        }

        section + section {
          margin-top: 32px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">INFORMATION NETWORKING FOR INNOVATION AND DESIGN</p>
        <h1>INIADの紹介</h1>
      </header>

      <section aria-labelledby="overview-title">
        <h2 id="overview-title">概要</h2>
        <p class="overview">INIADでは入学直後から、世界中で使われているプログラミング言語「Python」を学びます。さらに、ソースプログラム管理システム「Git」などを活用し、情報技術の基礎を身につけます。</p>
      </section>

      <section aria-labelledby="courses-title">
        <h2 id="courses-title">科目群一覧</h2>
        <ul>
          <li>コンピュータ・システム</li>
          <li>コンピュータ・ソフトウェア</li>
          <li>ユーザ・エクスペリエンス</li>
          <li>データサイエンス</li>
          <li>ICT社会応用</li>
          <li>連携科目群</li>
          <li>ビジネス構築</li>
          <li>コミュニティ形成</li>
        </ul>
      </section>
    </main>
  </body>
</html>
