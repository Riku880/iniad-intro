<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f0e7">
    <title>INIADの紹介</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f4f0e7;
        --ink: #171a19;
        --muted: #656b65;
        --orange: #ff6038;
        --lime: #d7f45b;
        --line: #d8d4c9;
        --serif: "Yu Mincho", "Hiragino Mincho ProN", serif;
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }

      body {
        min-height: 100vh;
        margin: 0;
        padding: clamp(18px, 4vw, 56px);
        background-color: var(--paper);
        background-image: radial-gradient(#171a1912 0.7px, transparent 0.7px);
        background-size: 7px 7px;
        color: var(--ink);
        font-family: "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
        font-size: 16px;
        line-height: 1.85;
      }

      main {
        width: min(100%, 1120px);
        margin: 0 auto;
      }

      header {
        position: relative;
        isolation: isolate;
        display: flex;
        min-height: clamp(360px, 54vw, 610px);
        flex-direction: column;
        justify-content: flex-end;
        padding: clamp(30px, 7vw, 88px);
        overflow: hidden;
        background: var(--ink);
        color: var(--paper);
      }

      header::before {
        position: absolute;
        z-index: -1;
        top: 8%;
        right: 7%;
        width: clamp(210px, 38vw, 450px);
        aspect-ratio: 1;
        border: 1px solid rgb(244 240 231 / 24%);
        border-radius: 50%;
        box-shadow: 0 0 0 34px rgb(244 240 231 / 5%), 0 0 0 70px rgb(244 240 231 / 4%);
        content: "";
      }

      header::after {
        position: absolute;
        z-index: -1;
        top: 15%;
        right: 15%;
        display: grid;
        width: clamp(150px, 27vw, 310px);
        aspect-ratio: 1;
        place-items: center;
        border-radius: 50%;
        background: var(--lime);
        color: var(--ink);
        content: "未来をつくる";
        font-size: clamp(1rem, 2.2vw, 1.5rem);
        font-weight: 900;
        letter-spacing: 0.12em;
        transform: rotate(12deg);
        animation: orbit 18s ease-in-out infinite alternate;
      }

      .eyebrow {
        max-width: 430px;
        margin: 0 0 22px;
        color: var(--lime);
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: 0.2em;
        line-height: 1.8;
      }

      h1 {
        position: relative;
        width: fit-content;
        margin: 0;
        font-size: clamp(3.2rem, 10.5vw, 8.5rem);
        font-weight: 900;
        letter-spacing: -0.07em;
        line-height: 1.04;
      }

      h1::after {
        position: absolute;
        right: -0.35em;
        bottom: 0.12em;
        width: 0.18em;
        height: 0.18em;
        border-radius: 50%;
        background: var(--orange);
        content: "";
      }

      section {
        position: relative;
        padding: clamp(42px, 7vw, 88px) 0;
        border-bottom: 1px solid var(--line);
      }

      section + section { margin-top: 0; }

      h2 {
        display: flex;
        align-items: baseline;
        gap: 18px;
        margin: 0 0 28px;
        color: var(--ink);
        font-size: clamp(1.7rem, 4vw, 2.7rem);
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 1.3;
      }

      h2::before {
        color: var(--orange);
        content: "01";
        font-family: var(--serif);
        font-size: 0.62em;
        font-style: italic;
        font-weight: 400;
        letter-spacing: 0;
      }

      h2::after {
        align-self: center;
        margin-left: auto;
        color: var(--muted);
        font-size: 0.62rem;
        font-weight: 800;
        letter-spacing: 0.16em;
      }

      section[aria-labelledby="overview-title"] h2::after { content: "ABOUT INIAD"; }
      section[aria-labelledby="courses-title"] h2::before { content: "02"; }
      section[aria-labelledby="courses-title"] h2::after { content: "FIND YOUR FIELD"; }
      p { margin: 0; }

      .overview {
        max-width: 850px;
        padding: clamp(24px, 4vw, 42px);
        border-left: 5px solid var(--orange);
        background: #fffdf7;
        box-shadow: 10px 10px 0 var(--lime);
        color: #414841;
        font-size: clamp(1rem, 1.8vw, 1.16rem);
        line-height: 2.1;
      }

      ul {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
        counter-reset: course;
      }

      li {
        position: relative;
        display: flex;
        min-height: 190px;
        flex-direction: column;
        justify-content: space-between;
        padding: 20px;
        overflow: hidden;
        border: 1px solid var(--ink);
        background: var(--paper);
        color: var(--ink);
        font-size: clamp(1rem, 1.5vw, 1.12rem);
        font-weight: 800;
        line-height: 1.55;
        counter-increment: course;
        transition: color 220ms ease, background 220ms ease, transform 220ms ease;
      }

      li::before {
        color: var(--orange);
        content: "0" counter(course);
        font-family: var(--serif);
        font-size: 0.85rem;
        font-style: italic;
        font-weight: 700;
      }

      li::after {
        position: absolute;
        right: -12px;
        bottom: -50px;
        color: rgb(23 26 25 / 7%);
        content: "↗";
        font-size: 8rem;
        font-weight: 400;
        line-height: 1;
        transition: transform 220ms ease;
      }

      li:hover {
        transform: translateY(-6px) rotate(-1deg);
        background: var(--lime);
      }

      li:hover::after { transform: translate(-10px, -10px) rotate(-10deg); }

      @media (max-width: 760px) {
        ul { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        li { min-height: 160px; }
      }

      @media (max-width: 520px) {
        body { padding: 12px; }
        header { min-height: 390px; padding: 28px 22px; }
        header::before { top: 7%; right: 2%; }
        header::after { top: 13%; right: 10%; }
        .eyebrow { max-width: 220px; font-size: 0.58rem; }
        h1 { font-size: clamp(3.15rem, 16vw, 5rem); }
        section { padding: 48px 0; }
        h2 { gap: 10px; margin-bottom: 22px; }
        h2::after { font-size: 0.48rem; letter-spacing: 0.1em; }
        .overview { padding: 20px; box-shadow: 6px 6px 0 var(--lime); }
        ul { gap: 9px; }
        li { min-height: 145px; padding: 15px; font-size: 0.92rem; }
      }

      @keyframes orbit {
        from { transform: rotate(8deg) translateY(0); }
        to { transform: rotate(16deg) translateY(12px); }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">INFORMATION NETWORKING FOR INNOVATION AND DESIGN</p>
        <h1>INIADの紹介</h1>
      </header>

      <section aria-labelledby="overview-title">
        <h2 id="overview-title">概要</h2>
        <p class="overview">INIADでは入学直後から、世界中で使われているプログラミング言語「Python」を学びます。さらに、ソースプログラム管理システムGitや、さまざまな情報技術を学び、社会の課題を解決する力を身につけます。</p>
      </section>

      <section aria-labelledby="courses-title">
        <h2 id="courses-title">科目群一覧</h2>
        <ul>
          <li>コンピュータ・システム</li>
          <li>コンピュータ・ソフトウェア</li>
          <li>ユーザ・エクスペリエンス</li>
          <li>データサイエンス</li>
          <li>ICT社会応用</li>
          <li>連携科目群</li>
          <li>ビジネス構築</li>
          <li>コミュニティ形成</li>
        </ul>
      </section>
    </main>
  </body>
</html>
